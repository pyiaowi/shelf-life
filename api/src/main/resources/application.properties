# H2 database saved as a file in your home folder, so data survives restarts
spring.datasource.url=jdbc:h2:file:~/shelf-life-data/inventory
spring.datasource.username=sa
spring.datasource.password=

# Create and update the tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false