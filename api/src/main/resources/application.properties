spring.application.name=api

# The host tells the app which port to use; locally it stays 8080
server.port=${PORT:8080}
# Trust the host's HTTPS proxy so redirects keep https://
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax

# Database: H2 file locally, PostgreSQL online
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:~/shelf-life-data/inventory}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login. The defaults are for local use only; set real values online.
app.username=${APP_USERNAME:admin}
app.password=${APP_PASSWORD:admin}
app.remember-me-key=${APP_REMEMBER_KEY:local-dev-only}